<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/animation.css">
    <title>Document</title>
</head>
<style>
    body {
        min-height: 100vh;
        background: linear-gradient(45deg, #FFFFF0, #cfcfcf);
        background-position: fixed;
        font-family: 'poppins', sans-serif;
    }

    .container-product {
        height: 480px;
        width: 100%;
        min-width: 300px;
        padding: 1rem;
        border-radius: 20px;
        background-color: #5f5f5f11;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
    }

    .product-details {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .product-details .product-details__image {
        position: relative;
        width: 60%;
        height: 100%;
        background-color: #e0e0e017;
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
    }

    .product-details .product-details__image img {
        width: 100%;
        height: 90%;
        filter: drop-shadow(0 0 5px #00000028);
        aspect-ratio: 1 / 2;
        object-fit: cover;
    }

    .product-details .product-details__image .btn-add {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.5rem 1.3rem;
        border: none;
        border-radius: 2rem;
        background-color: #ff0000;
        color: #fff;
        box-shadow:
            0 2px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
    }

    .product-details .product-details__info {
        height: 100%;
        width: 60%;
        display: flex;
        flex-direction: column;
    }

    .product-details .product-details__info h2 {
        margin: 0;
        font-size: .9rem;
        color: #fff;
    }

    .product-details .product-details__info p {
        margin: 0.5rem 0;
        font-size: .7rem;
        color: #fff;
    }

    .product-details .btn-check {
        padding: .8rem .3rem;
        border: 1px solid #fff;
        border-radius: 1rem;
        color: rgb(207, 207, 207);
        background-color: transparent;
        font-size: .7rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        cursor: pointer;
    }

    .popup {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
    }

    .popup .popup-content input {
        width: 100%;
        padding: 0.5rem;
        margin: 0.5rem 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .popup .popup-content button {
        padding: 0.5rem 1rem;
        margin: 0.5rem;
        border: none;
        border-radius: 5px;
        background-color: #ff0000;
        color: #fff;
        cursor: pointer;
    }
    @media (max-width: 420px) {
        .container-product {
            height: auto;
            .product-details {
                justify-content: center;
                flex-direction: column;
                gap: 1.2rem;
                .product-details__image {
                    width: 80%;
                }
            }
        }
    }
</style>

<body>
    <div class="container-product">

    </div>

    <div class="popup">
        <div class="popup-content"
            style="background-color: #fff; padding: 20px; border-radius: 5px; width: 300px; text-align: center;">
            <h2>Confirmar Compra</h2>
            <input type="text" id="username" placeholder="Nome ex:. Evanilda">
            <input type="text" id="phone" placeholder="Número de telefone">
            <input type="text" id="whatsapp" placeholder="Número do WhatsApp">
            <button id="btn-confirm">Confirmar</button>
            <button id="btn-cancel">Cancelar</button>
        </div>
    </div>


    <!-- Você também pode gostar -->
     <div class="container-more-products-like">
        <h1>Você também pode gostar</h1>
     </div>

</body>
<script type="module" src="js/comprar.js"></script>
</html>
